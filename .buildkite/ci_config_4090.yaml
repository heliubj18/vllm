# Config for the local 4090 Buildkite pipeline.
#
# Consumed by .buildkite/local-scripts/gen_pipeline.py, which reads the
# upstream step definitions in .buildkite/test_areas/ (never modified) and
# emits a Buildkite pipeline targeting the local agents.
#
# This is NOT part of vLLM upstream CI.

hardware:
  # Shown in the selection summary. Set per platform so the report identifies
  # which agent config produced it.
  name: 2x4090
  # Number of GPUs available on the test agent. Steps needing more are dropped.
  gpu_count: 2
  # Compute capability of the test agent (4090 = 8.9). Used for reporting only;
  # actual gating is via filter.arch_blocklist below.
  arch: sm89
  queue_gpu: gpu-4090
  queue_bootstrap: local-mac

# Image the test steps run in. Supplies the compiled vLLM (torch 2.13.0+cu130,
# the .so extensions, CUDA runtime); the test code itself comes from the
# checkout via docker.volumes below, because these images carry no tests/.
#
# Present locally on the test host, so always_pull stays false - the host's
# docker directory has little room to spare.
#
# Caveat: this image's torch.cuda.get_arch_list() is
# ['sm_75','sm_80','sm_86','sm_90','sm_100','sm_120'] - no sm_89. A 4090 is
# SM89, so kernels run through sm_86 PTX forward-compatibility rather than
# natively. Fine for exercising the pipeline; revisit before trusting the three
# must-run kernel steps as SM89 coverage.
image: "vllm/vllm-openai:nightly"

filter:
  # Steps pinned to hardware we do not have. A step with no `device:` field is
  # kept: upstream routes those to its L4 pool, which is also SM89 + 24GB.
  arch_blocklist:
    - h100
    - h200
    - h200_18gb
    - h200_35gb
    - b200
    - b200-k8s
    - a100
    - gh200
    - dgx-spark
    - ascend_npu
    - intel_cpu
    - intel_hpu
    - intel_gpu
    - arm_cpu
    - amd_cpu
    - zen5

  # Device-name prefixes to exclude, for families with many variants. `mi*`
  # covers every AMD GPU (mi250, mi300, mi325, ...); drop this on an AMD agent.
  arch_blocklist_prefixes:
    - mi

  # Fallback only, for steps whose pytest targets cannot be resolved statically
  # (shell wrappers, generated arg lists). Everything else is tiered by `cost`.
  auto_max_minutes: 20

  # A 4090 is slower than upstream's H200/H100, so scale the timeouts up.
  timeout_multiplier: 2.0

  # When non-empty, only these step keys are considered (debugging aid).
  step_allowlist: []

  # Steps excluded regardless of the rules above. Keep a reason on each entry.
  step_denylist:
    # The PD scripts run an unfiltered `pkill -9 -f "vllm serve"`. Safe inside a
    # container's PID namespace, but verify the docker plugin does not share the
    # host PID namespace before enabling these.
    - nixlconnector-pd-edge-cases-2-gpus
    - multiconnector-nixl-offloading-pd-accuracy-2-gpus
    - multiconnector-nixl-offloading-pd-edge-cases-2-gpus
    - hybrid-ssm-nixlconnector-pd-prefix-cache-2-gpus
    # Needs the CI image build pipeline, which this setup does not run.
    - docker-build-metadata
    # Seven `pip install -e ./plugins/...` calls, each paired with a later
    # `pip uninstall`. Both halves are incompatible with how tests get into the
    # container here: tests/ is mounted read-only, so building an editable wheel
    # cannot write its build metadata ("Getting requirements to build editable
    # did not run successfully", verified on the agent), and even with a
    # writable mount the installs would mutate the image's site-packages, which
    # is shared with every other concurrently-queued step. Upstream is fine
    # because each step gets a throwaway container with the tests baked in.
    # Revisit if these steps ever matter enough to justify a writable overlay.
    - plugin-tests-2-gpus

  # Emit a manual (block) step for tests the diff did not select, so they can
  # still be triggered by hand. Set false to omit them entirely.
  block_unselected: true

# How a step's cost is estimated. Upstream's `timeout_in_minutes` is not used as
# the primary signal: it is sized to include cold model downloads on upstream's
# own network, so it measures bandwidth more than work. Model data is pre-staged
# on the 4090 host and mounted into the container, so what remains is how a test
# obtains its model, which the generator reads out of the test source:
#
#   T0  no model touched at all, or the step runs no pytest
#   T1  in-process tests over a handful of models
#   T2  loads weights into VRAM (LLM(...)/vllm_runner), or compiles in most files
#   T3  spawns `vllm serve` per test, or sweeps many distinct models
#
# Timeout is consulted only for steps that stand up a server, where startup and
# readiness polling are real cost that pre-staged weights do not remove and that
# the source does not reveal. Those use filter.auto_max_minutes above. A step
# that never starts a server is judged purely on its tier.
cost:
  # Highest tier that still runs automatically. Everything above becomes a
  # manual (block) step.
  auto_max_tier: T2

  # Distinct-model count at which a step is treated as a sweep (T3) regardless
  # of mechanism. Each distinct model is one more load into VRAM.
  many_models: 20

  # Always run these, whatever the tier or diff says. For coverage that must not
  # regress silently: kernel correctness on SM89 is the reason this agent exists,
  # and a kernel break is both likely to be caught here and cheap to run.
  # Overrides the tier gate and changed-file selection, but not the hardware
  # layer above - a step needing 4 GPUs stays excluded regardless.
  must_run:
    # 38 in-process files, no engine, no server. Pure kernel compute.
    - kernels-attention-test
    # 51 files. Covers the fused MoE path this fork changes most often.
    - kernels-moe-test
    # 44 files. SM89 quantization kernels (marlin/gptq/awq).
    - kernels-quantization-test

# Any changed file matching these runs the full selected set, ignoring per-step
# source_file_dependencies. Mirrors upstream's run_all_patterns.
#
# Keep this list narrow: anything here defeats incremental selection. The two
# CI entries cover changes to the selection logic itself, so a config or
# generator edit is validated against every viable step.
run_all_patterns:
  - setup.py
  - CMakeLists.txt
  - csrc/
  - cmake/
  - requirements/
  - .buildkite/ci_config_4090.yaml
  - .buildkite/local-scripts/gen_pipeline.py

run_all_exclude_patterns:
  - csrc/cpu/
  - csrc/rocm/
  - cmake/hipify.py
  - cmake/cpu_extension.cmake

# Abandon the run as soon as any step fails, rather than working through the
# queue for a result that is already red.
#
# This matters more here than upstream. Every GPU step contends for one box with
# gpu_slots: 1, so steps behind a failure are queued for a single slot and the
# tail is long - Sequence Parallel alone is 41 minutes. Re-running after a fix
# costs less than sitting through a run whose verdict is settled.
#
# Set false when you want a full inventory of what is broken in one pass, which
# is the better trade while bringing new steps online.
fail_fast: true

# Injected into every generated test step.
env:
  # https://github.com/NVIDIA/nccl/issues/1838
  NCCL_CUMEM_HOST_ENABLE: "0"

  # Upstream sets this only for the steps that need it (ROCm-specific models,
  # Whisper deadlocks - see test-amd.yaml), never pipeline-wide, so we follow
  # suit and leave it to the step's own commands, which reach the container
  # unmodified. Forcing spawn globally is not the safe default it looks like:
  # tests/basic_correctness/test_basic_correctness.py:244 documents ordering
  # written against fork semantics.
  #
  # Removing it does NOT fix Model Runner V2 Distributed, which fails with
  # "Cannot re-initialize CUDA in forked subprocess" either way - that one's
  # root cause is a WorkerProc background exception, still unidentified.

  # Where the model mount lands. Kept on /models (a separate 3.5T NVMe with
  # 1.5T free) because the root filesystem only has ~56G. Models are downloaded
  # once and never deleted, so repeat runs are offline and fast.
  #
  # /models itself is shared with other users' data, so only the
  # chengfeng-test subdirectory is mounted, never /models.
  HF_HOME: /models/chengfeng-test

  # Models are pre-staged, so a cache miss is a staging bug. Failing fast beats
  # silently pulling tens of GB mid-test and blowing the step's timeout.
  #
  # Staging is not just downloading: the host cannot reach huggingface.co at all
  # (DNS resolves, port 443 refused), so anything fetched has to go through
  # HF_ENDPOINT=https://hf-mirror.com. Set HF_HUB_OFFLINE=0 and that endpoint
  # when deliberately adding a model. Test runs never need the endpoint - they
  # are fully offline.
  HF_HUB_OFFLINE: "1"

  # The serving images ship pytest but none of the test plugins upstream's
  # commands rely on (pytest-shard's --shard-id, pytest-timeout's --timeout,
  # pytest-forked's --forked, plus tblib for pickling test exceptions). They are
  # installed once into a persistent venv on the host, and put on the path here
  # rather than by rewriting commands: upstream calls a bare `pytest`, and this
  # generator never edits upstream command strings.
  #
  # The venv is created with --system-site-packages, so torch and the compiled
  # vllm still come from the image. The image's torch (2.13.0+cu130) already
  # matches what requirements/test/cuda.in pins, so nothing overwrites it.
  PYTHONPATH: /test-venv/lib/python3.12/site-packages

  # Point vLLM's cache root at the persistent mount above, so torch.compile
  # results survive the container. Defaults to ~/.cache/vllm, which is inside
  # the image.
  VLLM_CACHE_ROOT: /vllm-cache

# Serializing execution on the test agent.
#
# Buildkite dispatches steps in parallel by default. Upstream can allow that
# because it routes each step shape to its own elastic queue (gpu_1_queue,
# gpu_4_queue) where concurrent steps land on separate machines. Here every step
# targets one box and asks the docker plugin for `gpus: all`, so two concurrent
# steps would contend for the same VRAM - showing up as OOMs and NCCL failures
# that look like flaky tests.
#
# Buildkite has three ordering tools and only one fits:
#   depends_on  - expresses "B needs A's result". Wrong tool: these steps are
#                 independent, and a chain of 26 would also serialize the CPU
#                 steps needlessly and make one failure block the rest.
#   wait        - a pipeline-wide barrier. Too coarse, and it does not limit
#                 anything within a group of parallel steps.
#   concurrency - caps how many jobs from a group run at once, across builds.
#                 This is the resource-contention tool, so it is what we use.
concurrency:
  # Set false to emit no concurrency keys, e.g. if the agent already runs with
  # spawn=1 and you would rather rely on that.
  enabled: true

  # Groups are organization-wide, so the queue name is folded into the group to
  # keep different hardware from blocking each other.
  group_prefix: vllm-ci

  # GPU steps that may run at once. Keep at 1 unless the box has enough VRAM for
  # two concurrent steps - a step asks for all GPUs, not a slice.
  gpu_slots: 1

  # CPU-only steps do not touch VRAM so they can overlap with GPU work, but they
  # still share host RAM and cores.
  cpu_slots: 2

# Settings for the docker plugin on the *test* agent. The generating agent never
# runs docker; it only serializes these into the pipeline it uploads, and the GPU
# agent's docker plugin consumes them.
docker:
  # Pull the image on every run. Leave false while iterating on a local image.
  always_pull: false
  # Docker's default 64MB is not enough for vLLM's multiprocessing.
  shm_size: "8gb"

  # The serving images set ENTRYPOINT to `vllm serve`. Without overriding it the
  # step's commands are parsed as arguments to that (the shell's -c became
  # --compilation-config) and every job exits 125 before running anything.
  entrypoint: "bash"

  # Do not let the plugin mount the whole checkout over workdir (its default).
  # The volumes below mount tests/ and .buildkite/ deliberately; mounting the
  # repository root as well would put the checkout's vllm/ source directory on
  # sys.path, shadowing the image's compiled package.
  mount_checkout: false

  # Which GPUs a test step may use. NOT "all": this host has 8 RTX 4090s and
  # other people run jobs on some of them, so seizing every device would OOM
  # their work. Pin to the two this agent owns. Keep in step with
  # hardware.gpu_count above.
  gpus: '"device=0,1"'

  # Host mounts, all on the *test* agent. Two groups:
  #
  # 1. The test code. The vllm/vllm-openai images are slim serving images and
  #    carry no tests/ at all (upstream builds tests into the `test` stage of
  #    docker/Dockerfile instead), so tests come from the Buildkite checkout.
  #    Only tests/, .buildkite/ and pyproject.toml are mounted - never the
  #    repository root. Mounting the root puts the checkout's own vllm/ source
  #    directory on sys.path, where it shadows the compiled package in the
  #    image and every kernel test dies with
  #    "_OpNamespace '_C' object has no attribute gelu_fast".
  #
  # 2. Model data and the test-dependency venv, pre-staged on the host and kept
  #    across runs. Read-write on purpose: vLLM's weight loader takes a filelock
  #    inside the cache dir (weight_utils.get_lock) and huggingface_hub writes
  #    refs and blob symlinks even on a cache hit, so :ro fails every model test.
  #
  # $BUILDKITE_BUILD_CHECKOUT_PATH is expanded by the agent, so the same config
  # works for any build. Host and agent-container build paths are identical
  # (/opt/buildkite/builds), which is what makes these mounts resolve correctly
  # under docker-outside-of-docker.
  volumes:
    - "$BUILDKITE_BUILD_CHECKOUT_PATH/tests:/vllm-workspace/tests:ro"
    - "$BUILDKITE_BUILD_CHECKOUT_PATH/.buildkite:/vllm-workspace/.buildkite:ro"
    - "$BUILDKITE_BUILD_CHECKOUT_PATH/pyproject.toml:/vllm-workspace/pyproject.toml:ro"
    # 1.1G of pytest plugins and test-only libraries, built by
    # local-scripts/setup-test-venv.sh. On /models rather than the root
    # filesystem, which sits at 95% with 50G left. The venv records only the
    # in-container path (/test-venv) in pyvenv.cfg and its shebangs, so the host
    # side can be moved with a plain mv - nothing inside it needs rebuilding.
    #
    # Kept in chengfeng-ci/, a sibling of the model directory rather than a
    # child: HF_HOME points at chengfeng-test, so anything under it shows up
    # alongside hub/ as if it were cache content.
    - "/models/chengfeng-ci/test-venv:/test-venv"
    - "/models/chengfeng-test:/models/chengfeng-test"
    # torch.compile output, keyed by VLLM_CACHE_ROOT below. Without this the
    # cache lands inside the container and dies with it on --rm, so every step
    # recompiles graphs a previous step already built. Build #15's Sequence
    # Parallel step spent 34.75s on the first torch.compile and 9-12s on each
    # subsequent engine init, across 45 cases - all of it repeated on the next
    # run. Read-write, and shared between steps on purpose: the cache is keyed
    # by graph and config, so hits across steps are exactly what we want.
    #
    # On /models rather than the root filesystem: this grows without bound as
    # graph shapes accumulate, and the root filesystem is at 95% with 50G left.
    # Safe to delete wholesale when it gets large - it only costs recompilation,
    # which is the opposite of the model cache next door, where a delete means
    # re-downloading tens of GB.
    - "/models/chengfeng-ci/vllm-cache:/vllm-cache"
    # The host already had a populated HF cache before this pipeline existed,
    # holding several repos the tests want - including meta-llama/Llama-3.1-8B-Instruct
    # (15G on disk) and Llama-3.2-1B-Instruct. Those are symlinked into the
    # cache above rather than re-downloaded, so this mount is what keeps the
    # links resolvable inside the container. Read-only: the directory belongs
    # to other users and nothing here may write to it. If they delete a repo,
    # the link dangles and that model has to be downloaded into
    # chengfeng-test/hub like the rest.
    - "/models/.cache/huggingface/hub:/models/.cache/huggingface/hub:ro"
    # Read-write, and inside the checkout: artifact_paths is resolved by the
    # agent relative to the checkout, so the reports have to land there for the
    # upload to find them. The other checkout mounts above are :ro.
    - "$BUILDKITE_BUILD_CHECKOUT_PATH/test-reports:/vllm-workspace/test-reports"

report:
  # Where each step writes its JUnit XML. Must sit under the checkout the docker
  # plugin mounts, otherwise artifact_paths cannot see it from the host.
  junit_dir: /vllm-workspace/test-reports
  # Absolute path to the guard script inside the container.
  checker_path: /vllm-workspace/.buildkite/local-scripts/check_skip_ratio.py
  # Buildkite artifact glob. Results are uploaded even when a step fails.
  artifact_paths: "test-reports/**/*.xml"
  # Fail a step when this fraction of its collected tests was skipped. A 4090
  # skips every sm90+/sm100-gated test, and pytest exits 0 in that case, so
  # without this check an all-skipped run looks green.
  #
  # Values must be calibrated per step on real hardware. Until then the check
  # runs in warn-only mode.
  skip_ratio_enforce: false
  skip_ratio_default: 0.9
